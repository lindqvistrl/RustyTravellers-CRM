*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f0e8;color:#1a1005;font-size:13px}
header{background:#084726;color:#F9F3E8;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

.toolbar{background:#fff;padding:12px 24px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #ddd;flex-wrap:wrap}

.toolbar select{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:12px}
.btn-new{padding:8px 16px;background:#c8860a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.btn-exp{padding:8px 16px;background:#1a3a5c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.btn-imp{padding:8px 16px;background:#4a2060;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.stats{background:#084726;color:#F9F3E8;padding:8px 24px;font-size:12px;display:flex;gap:20px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
thead th{padding:10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;position:sticky;top:0;background:#ddd4bc;white-space:nowrap;z-index:10}
tbody tr.mr{border-bottom:1px solid #e8e0d0;cursor:pointer}
tbody tr.mr:hover{background:#ede8dd}
tbody tr.mr.sk{background:#e8f5e9}tbody tr.mr.si{background:#e8f0ff}tbody tr.mr.sn{background:#fde8e8}
tbody tr.mr.ex{background:#fff8ec!important}
tbody tr.dr{display:none;background:#fff8ec;border-bottom:2px solid #ddd4bc}
tbody tr.dr.op{display:table-row}
td{padding:8px 10px;vertical-align:middle}
.ah td{background:#084726;color:#F9F3E8;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:6px 12px}

  var custom=JSON.parse(localStorage.getItem('rtcrm_custom')||'[]');
  custom.forEach(function(c){if(!SRC.some(function(r){return gk(r)===gk(c);}))SRC.push(c);});
  var areas=[],seen={};
  SRC.forEach(function(r){if(!seen[r.area]){seen[r.area]=1;areas.push(r.area);}});
  areas.sort();
  var sel=document.getElementById('fa');
  areas.forEach(function(a){var o=document.createElement('option');o.value=a;o.textContent=a;sel.appendChild(o);});
  document.getElementById('tc').textContent=SRC.length+' kontakter';
  var edits=JSON.parse(localStorage.getItem('rtcrm_edits')||'{}');
  Object.keys(edits).forEach(function(k){var r=SRC.filter(function(r){return gk(r)===k;})[0];if(r)Object.assign(r,edits[k]);});
  us();rt(fd());
}
function us(){
  var k=SRC.filter(function(r){return gs(r)==='kontaktad';}).length;
  var i=SRC.filter(function(r){return gs(r)==='intresserad';}).length;
  document.getElementById('s1').textContent='Totalt: '+SRC.length;
  document.getElementById('s2').textContent='Kontaktade: '+k;
  document.getElementById('s3').textContent='Intresserade: '+i;
}
function fd(){
  var s=document.getElementById('srch').value.toLowerCase();
  var a=document.getElementById('fa').value;
  var st=document.getElementById('fs').value;
  var e=document.getElementById('fe').value;
  return SRC.filter(function(r){
    var ms=!s||r.name.toLowerCase().indexOf(s)>=0||r.ort.toLowerCase().indexOf(s)>=0||(r.email||'').toLowerCase().indexOf(s)>=0;
    var ma=!a||r.area===a;
    var status=gs(r);
    var mst=!st||status===st;
    var fu=gfu(r);
    var me=!e||(e==='har'&&r.email)||(e==='form'&&!r.email&&fu);
    return ms&&ma&&mst&&me;
  });
}
function mk(tag,cls,txt){var el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el;}
function rt(data){
  var tb=document.getElementById('tb');tb.innerHTML='';
  var ca='';
  data.forEach(function(r){
    var k=gk(r),d=gd(r),st=gs(r),fu=gfu(r);
    if(r.area!==ca){
      ca=r.area;var atr=mk('tr','ah');var atd=mk('td');atd.colSpan=8;atd.textContent=r.area;
      atr.appendChild(atd);tb.appendChild(atr);
    }
    var tr=mk('tr','mr '+(RCB[st]||'')+(eK===k?' ex':''));
    (function(kk){tr.onclick=function(){te(kk);};})(k);
    var c1=mk('td');var sp=mk('strong');sp.textContent=r.name+(eK===k?' \u25b2':' \u25bc');c1.appendChild(sp);tr.appendChild(c1);
    tr.appendChild(mk('td','',r.ort||'-'));
    var c3=mk('td','',r.email||'-');c3.style.fontSize='11px';c3.style.color='#084726';tr.appendChild(c3);
    var c4=mk('td','',r.contact||'-');c4.style.fontSize='11px';tr.appendChild(c4);
    var c5=mk('td','',r.typ||'-');c5.style.fontSize='10px';c5.style.color='#666';tr.appendChild(c5);
    var c6=mk('td');var badge=mk('span','sb '+(SCB[st]||'se'),SLB[st]||'Ej kontaktad');c6.appendChild(badge);tr.appendChild(c6);
    var c7=mk('td');
    if(r.email){
      var btn=mk('button','bm','\u2709 Mail');
      (function(em,nm,kk){btn.onclick=function(ev){ev.stopPropagation();sMM(em,nm,kk);};})(r.email,r.name,k);
      c7.appendChild(btn);
    }else if(fu){
      var anc=document.createElement('a');anc.className='bf';anc.textContent='Form';
      anc.href=fu;anc.target='_blank';anc.onclick=function(ev){ev.stopPropagation();};c7.appendChild(anc);
    }else{
      var db=mk('button','bm nc','-');db.disabled=true;c7.appendChild(db);
    }
    tr.appendChild(c7);
    var c8=mk('td');c8.innerHTML=d.date?'<span style="font-size:10px;color:#555">'+d.date+'</span>':'-';tr.appendChild(c8);
    tb.appendChild(tr);
    var dtr=mk('tr','dr'+(eK===k?' op':''));
    var dtd=mk('td');dtd.colSpan=8;
    var safe='k'+(k.split('').reduce(function(a,c){return(a*31+c.charCodeAt(0))&0x7fffffff;},0));
    var dpDiv=mk('div','dp');var dg=mk('div','dg');
    [{l:'Butiknamn',id:'dn',v:r.name},{l:'Ort',id:'do',v:r.ort||''},{l:'Epost',id:'de',v:r.email||''},{l:'Ansvarig',id:'dc',v:r.contact||''},{l:'Typ',id:'dt2',v:r.typ||''}].forEach(function(f){
      var w=mk('div');var lbl=mk('label','',f.l);var inp=mk('input');inp.id=f.id+'_'+safe;inp.value=f.v;
      w.appendChild(lbl);w.appendChild(inp);dg.appendChild(w);
    });
    var sw=mk('div');var sl=mk('label','','Status');var ss=mk('select');ss.id='st_'+safe;
    ['ej','kontaktad','intresserad','inte'].forEach(function(v){var o=mk('option','',SLB[v]);o.value=v;if((d.status||'ej')===v)o.selected=true;ss.appendChild(o);});
    sw.appendChild(sl);sw.appendChild(ss);dg.appendChild(sw);
    var cw=mk('div');var cl=mk('label','','Kontakttyp');var cs=mk('select');cs.id='ct_'+safe;
    [['','- Välj -'],['Mail','Mail'],['Telefon','Telefon'],['Personligt möte','Personligt möte'],['Formulär','Formulär'],['Annat','Annat']].forEach(function(p){var o=mk('option','',p[1]);o.value=p[0];if((d.contactType||'')===p[0])o.selected=true;cs.appendChild(o);});
    cw.appendChild(cl);cw.appendChild(cs);dg.appendChild(cw);
    var dtw=mk('div');var dtl=mk('label','','Datum');var dti=mk('input');dti.type='date';dti.id='dt_'+safe;dti.value=d.date||'';dtw.appendChild(dtl);dtw.appendChild(dti);dg.appendChild(dtw);
    var nw=mk('div');nw.style.gridColumn='span 3';var nl=mk('label','','Anteckningar');var nt=document.createElement('textarea');nt.id='nt_'+safe;nt.textContent=d.notes||'';nw.appendChild(nl);nw.appendChild(nt);dg.appendChild(nw);
    dpDiv.appendChild(dg);
    var da=mk('div','da');
    var sv=mk('button','bs','Spara');(function(kk,sf){sv.onclick=function(){svr(kk,sf);};})(k,safe);
    var dl=mk('button','bd','Ta bort');(function(kk){dl.onclick=function(){delC(kk);};})(k);
    da.appendChild(sv);da.appendChild(dl);dpDiv.appendChild(da);
    dtd.appendChild(dpDiv);dtr.appendChild(dtd);tb.appendChild(dtr);
  });
  document.getElementById('s4').textContent='Visar: '+data.length;
}
function svr(k,safe){
  var d=lr(k);
  d.status=(document.getElementById('st_'+safe)||{}).value||'ej';
  d.contactType=(document.getElementById('ct_'+safe)||{}).value||'';
  d.date=(document.getElementById('dt_'+safe)||{}).value||'';
  d.notes=(document.getElementById('nt_'+safe)||{}).value||'';
  sr2(k,d);
  var r=SRC.filter(function(r){return gk(r)===k;})[0];
  if(r){
    r.name=(document.getElementById('dn_'+safe)||{}).value||r.name;
    r.ort=(document.getElementById('do_'+safe)||{}).value||r.ort;
    r.email=(document.getElementById('de_'+safe)||{}).value||r.email;
    r.contact=(document.getElementById('dc_'+safe)||{}).value||r.contact;
    r.typ=(document.getElementById('dt2_'+safe)||{}).value||r.typ;
    var edits=JSON.parse(localStorage.getItem('rtcrm_edits')||'{}');
    edits[k]={name:r.name,ort:r.ort,email:r.email,contact:r.contact,typ:r.typ};
    localStorage.setItem('rtcrm_edits',JSON.stringify(edits));
  }
  eK=null;us();rt(fd());
}
function delC(k){
  if(!confirm('Ta bort?'))return;
  var idx=-1;SRC.forEach(function(r,i){if(gk(r)===k)idx=i;});
  if(idx>-1)SRC.splice(idx,1);
  var custom=JSON.parse(localStorage.getItem('rtcrm_custom')||'[]');
  localStorage.setItem('rtcrm_custom',JSON.stringify(custom.filter(function(c){return gk(c)!==k;})));
  localStorage.removeItem('rtcrm_'+k);
  eK=null;us();document.getElementById('tc').textContent=SRC.length+' kontakter';rt(fd());
}
function te(k){eK=eK===k?null:k;rt(fd());}
function ft(){rt(fd());}
function showNM(){document.getElementById('nm').classList.add('ac');}
function cNM(){document.getElementById('nm').classList.remove('ac');}
function saveNC(){
  var name=document.getElementById('nn').value.trim();
  if(!name){alert('Namn krävs');return;}
  var nr={area:document.getElementById('na').value||'ÖVRIGT',name:name,ort:document.getElementById('no2').value||'',email:document.getElementById('ne').value||'',contact:document.getElementById('nc').value||'',typ:document.getElementById('nt2').value||'',kontaktad:'',note:document.getElementById('nno').value||''};
  SRC.push(nr);
  var custom=JSON.parse(localStorage.getItem('rtcrm_custom')||'[]');
  custom.push(nr);localStorage.setItem('rtcrm_custom',JSON.stringify(custom));
  cNM();['na','nn','no2','ne','nc','nt2','nno'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('tc').textContent=SRC.length+' kontakter';us();rt(fd());
}
function sMM(email,name,k){
  cE=email;cN=name;cK=k;
  document.getElementById('mr').textContent=name+' <'+email+'>';
  var r=SRC.filter(function(r){return gk(r)===k;})[0];
  var malltyp=r?(r.area==='MC-BUTIKER'?'MC':(r.area==='CYKELBUTIKER / BIKEPACKING'?'Cykel':'Standard')):'Standard';
  document.getElementById('mall-typ').textContent='Mall: '+malltyp;
  document.getElementById('mm').classList.add('ac');
}
function cMM(){document.getElementById('mm').classList.remove('ac');}
function doMail(prefill){
  cMM();
  var r=SRC.filter(function(r){return gk(r)===cK;})[0];
  if(r){var d=lr(cK);d.status='kontaktad';d.date=new Date().toISOString().split('T')[0];d.contactType='Mail';sr2(cK,d);}
  us();rt(fd());
  var body=r?getBody(r):BOD;
  setTimeout(function(){window.location.href=prefill?'mailto:'+cE+'?subject='+encodeURIComponent(SUB)+'&body='+encodeURIComponent(body):'mailto:'+cE;},200);
}
function doExp(){
  var keys=Object.keys(localStorage).filter(function(k){return k.indexOf('rtcrm_')===0;});
  var data={};keys.forEach(function(k){try{data[k]=JSON.parse(localStorage.getItem(k));}catch(e){data[k]=localStorage.getItem(k);}});
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='rusty-crm-data-'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(url);
}
document.getElementById('mm').addEventListener('click',function(e){if(e.target===this)cMM();});
document.getElementById('nm').addEventListener('click',function(e){if(e.target===this)cNM();});
init();

function importData(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        var count=0;
        Object.keys(data).forEach(function(k){
          if(k.startsWith('rtcrm_')){
            localStorage.setItem(k,JSON.stringify(data[k]));
            count++;
          }
        });
        alert('Importerat '+count+' poster. Laddar om...');
        location.reload();
      }catch(err){
        alert('Fel vid import: '+err.message);
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}
